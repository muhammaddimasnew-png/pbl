<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Tugas & Jadwal Belajar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
     <video autoplay muted loop class="video-bg">
        <source src="videobg1.mp4" type="video/mp4">
    </video>
    <div class="video-overlay"></div>
  <header>
    <h3 class="judul">Daftar Tugas & Jadwal Belajar</h3>
    <div class="menu-icon">&#9776;</div>
  </header>

  <main>
    <div class="login-box">
      <img src="logoapk1.png" alt="Logo DJ" class="logo">

      <form id="loginForm">
        <div class="input-group">
          <span class="icon">👤</span>
          <input type="text" id="username" placeholder="Username" required>
        </div>

        <div class="input-group">
          <span class="icon">🔒</span>
          <input type="password" id="password" placeholder="Password" required>
        </div>

        <button type="submit" class="login-btn">LOGIN</button>
      </form>

      <p class="note">
        Harap login menggunakan NIM yang telah diberikan oleh<br>
        <b>POLITEKNIK NEGERI BATAM</b> sebagai USERNAME dan PASSWORD.
      </p>
    </div>
  </main>

  <footer>
    <p>© 2026 TIM PBL — Aplikasi Daftar Tugas dan Jadwal Belajar</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
